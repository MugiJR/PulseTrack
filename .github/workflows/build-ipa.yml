name: Build PulseTrack IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project PulseTrack.xcodeproj -target PulseTrack \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA (with HealthKit entitlement for Sideloadly)
        run: |
          APP="build/Release-iphoneos/PulseTrack.app"
          codesign --force --sign - --entitlements PulseTrack/PulseTrack.entitlements "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PulseTrack.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PulseTrack-ipa
          path: PulseTrack.ipa
